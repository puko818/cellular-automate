<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gray-Scott Mitosis Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      color: #d0d0d0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 680px; }

    h1 { color: #39ff14; font-size: 1.6rem; letter-spacing: 1px; }
    .subtitle { color: #555; font-size: 0.82rem; margin-top: 4px; margin-bottom: 36px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 28px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      color: #e8e8e8;
      padding: 9px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #39ff14; outline: none; }
    .field input::placeholder { color: #444; }

    .hint { font-size: 0.7rem; color: #444; margin-top: 5px; }

    .full { grid-column: 1 / -1; }

    .divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 4px 0;
    }

    #run-btn {
      width: 100%;
      background: #39ff14;
      color: #000;
      border: none;
      padding: 13px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #run-btn:hover:not(:disabled) { opacity: 0.85; }
    #run-btn:disabled { background: #1c3a08; color: #3a6010; cursor: not-allowed; }

    #status-box {
      display: none;
      margin-top: 24px;
      padding: 14px 16px;
      background: #0e0e0e;
      border-radius: 4px;
      border-left: 3px solid #333;
      font-size: 0.88rem;
    }
    #status-box.running { border-color: #f0a030; }
    #status-box.done    { border-color: #39ff14; }
    #status-box.error   { border-color: #ff4040; color: #ff7070; }

    #video-player {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 4px;
      border: 1px solid #1e1e1e;
      background: #000;
    }

    #download-btn {
      display: none;
      width: 100%;
      margin-top: 12px;
      background: transparent;
      color: #39ff14;
      border: 1px solid #39ff14;
      padding: 11px;
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #download-btn:hover { background: #39ff14; color: #000; }
  </style>
</head>
<body>
<div class="container">
  <h1>Gray-Scott Mitosis</h1>
  <p class="subtitle">Reaction-diffusion simulator &mdash; renders MP4 with GFP fluorescence colormap</p>

  <div class="grid">

    <div class="field">
      <label>Width (px)</label>
      <input type="number" id="width" value="1080" min="64" max="3840" step="2">
    </div>
    <div class="field">
      <label>Height (px)</label>
      <input type="number" id="height" value="1080" min="64" max="3840" step="2">
    </div>

    <div class="field">
      <label>Duration (s)</label>
      <input type="number" id="duration" value="10" min="1" max="300">
    </div>
    <div class="field">
      <label>FPS</label>
      <input type="number" id="fps" value="15" min="1" max="60">
    </div>

    <hr class="divider">

    <div class="field">
      <label>Seed blobs</label>
      <input type="number" id="seeds" value="15" min="1" max="300">
      <p class="hint">Number of starting cells</p>
    </div>
    <div class="field">
      <label>Burn-in steps</label>
      <input type="number" id="burn_in" value="2000" min="0" max="10000">
      <p class="hint">Warm-up before recording starts</p>
    </div>

    <div class="field">
      <label>Steps / frame</label>
      <input type="number" id="steps_frame" value="8" min="1" max="100">
      <p class="hint">Higher = faster apparent motion</p>
    </div>
    <div class="field">
      <label>CRF quality (0–51)</label>
      <input type="number" id="crf" value="18" min="0" max="51">
      <p class="hint">Lower = larger file, better quality</p>
    </div>

    <div class="field">
      <label>RNG seed (optional)</label>
      <input type="number" id="seed" placeholder="random">
      <p class="hint">Set for reproducible output</p>
    </div>

    <hr class="divider">

    <div class="full">
      <button id="run-btn" onclick="runSimulation()">Run Simulation</button>
    </div>

  </div>

  <div id="status-box"><span id="status-text"></span></div>
  <video id="video-player" controls autoplay loop></video>
  <button id="download-btn" onclick="downloadResult()">&#8595; Download MP4</button>
</div>

<script>
  let currentJobId  = null;
  let pollInterval  = null;

  async function runSimulation() {
    clearInterval(pollInterval);

    const seedVal = document.getElementById('seed').value;
    const args = {
      width:       parseInt(document.getElementById('width').value),
      height:      parseInt(document.getElementById('height').value),
      duration:    parseFloat(document.getElementById('duration').value),
      fps:         parseInt(document.getElementById('fps').value),
      seeds:       parseInt(document.getElementById('seeds').value),
      burn_in:     parseInt(document.getElementById('burn_in').value),
      steps_frame: parseInt(document.getElementById('steps_frame').value),
      crf:         parseInt(document.getElementById('crf').value),
      seed:        seedVal !== '' ? parseInt(seedVal) : null,
    };

    setStatus('running', 'Starting simulation…');
    document.getElementById('run-btn').disabled = true;
    document.getElementById('run-btn').textContent = 'Running…';
    document.getElementById('video-player').style.display = 'none';
    document.getElementById('video-player').src = '';
    document.getElementById('download-btn').style.display = 'none';

    const resp = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
    const data = await resp.json();
    currentJobId = data.job_id;
    pollInterval = setInterval(poll, 3000);
  }

  async function poll() {
    const resp = await fetch(`/status/${currentJobId}`);
    const data = await resp.json();

    if (data.status === 'done') {
      clearInterval(pollInterval);
      setStatus('done', 'Done — playing below.');
      resetBtn();
      const player = document.getElementById('video-player');
      player.src = `/view/${currentJobId}`;
      player.style.display = 'block';
      document.getElementById('download-btn').style.display = 'block';
    } else if (data.status === 'error') {
      clearInterval(pollInterval);
      setStatus('error', 'Error: ' + (data.error || 'unknown'));
      resetBtn();
    } else {
      setStatus('running', `Running… (${data.status})`);
    }
  }

  function setStatus(cls, msg) {
    const box = document.getElementById('status-box');
    box.style.display = 'block';
    box.className = cls;
    document.getElementById('status-text').textContent = msg;
  }

  function resetBtn() {
    const btn = document.getElementById('run-btn');
    btn.disabled = false;
    btn.textContent = 'Run Simulation';
  }

  function downloadResult() {
    if (currentJobId) window.location.href = `/download/${currentJobId}`;
  }
</script>
</body>
</html>
