version: 0.2

phases:
  pre_build:
    commands:
      - ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
      - docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  post_build:
    commands:
      - |
        EXISTING=$(aws apprunner list-services \
          --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" \
          --output text)
        if [ -z "$EXISTING" ]; then
          URL=$(aws apprunner create-service \
            --service-name $SERVICE_NAME \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"$ECR_REGISTRY/$ECR_REPOSITORY:latest\",
                \"ImageConfiguration\": {\"Port\": \"5000\"},
                \"ImageRepositoryType\": \"ECR\"
              },
              \"AuthenticationConfiguration\": {
                \"AccessRoleArn\": \"$APPRUNNER_ROLE_ARN\"
              },
              \"AutoDeploymentsEnabled\": true
            }" \
            --instance-configuration '{"Cpu":"1 vCPU","Memory":"2 GB"}' \
            --query "Service.ServiceUrl" --output text)
          echo "Deployed! Service URL: https://$URL"
        else
          echo "App Runner will auto-deploy the new image."
        fi
