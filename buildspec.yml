version: 0.2

phases:
  pre_build:
    commands:
      - ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
      - docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  post_build:
    commands:
      # Generate Dockerrun.aws.json with the actual ECR image URL and upload to EB
      - printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s/%s:latest","Update":"true"},"Ports":[{"ContainerPort":5000}]}' "$ECR_REGISTRY" "$ECR_REPOSITORY" > Dockerrun.aws.json
      - zip deploy.zip Dockerrun.aws.json
      - S3_KEY="deploy-${CODEBUILD_BUILD_NUMBER}.zip"
      - aws s3 cp deploy.zip s3://$EB_BUCKET/$S3_KEY
      - aws elasticbeanstalk create-application-version --application-name $APP_NAME --version-label "v${CODEBUILD_BUILD_NUMBER}" --source-bundle S3Bucket=$EB_BUCKET,S3Key=$S3_KEY
      - aws elasticbeanstalk update-environment --environment-name $EB_ENV_NAME --version-label "v${CODEBUILD_BUILD_NUMBER}"
      - URL=$(aws elasticbeanstalk describe-environments --environment-names $EB_ENV_NAME --query "Environments[0].CNAME" --output text)
      - echo "App URL - http://$URL"
